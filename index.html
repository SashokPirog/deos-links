<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deos — открыть приглашение</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0d12; color: #e8ecf4;
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card { width: 100%; max-width: 420px; text-align: center; }
  .logo {
    width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px;
    background: linear-gradient(145deg, #2f6bff, #6a3cff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 26px; letter-spacing: -1px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #98a2b8; font-size: 14px; }
  a.btn {
    display: block; padding: 16px; border-radius: 14px; text-decoration: none;
    background: linear-gradient(145deg, #2f6bff, #6a3cff); color: #fff;
    font-weight: 600; -webkit-tap-highlight-color: transparent;
  }
  a.btn:active { opacity: .85; }
  .hint { margin-top: 18px; font-size: 12px; color: #6b7488; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">D</div>
  <h1>Приглашение Deos</h1>
  <p id="msg">Открываем приложение…</p>
  <a class="btn" id="open" href="#">Открыть в Deos</a>
  <div class="hint" id="raw"></div>
</div>
<script>
  var hash = location.hash.slice(1);
  var target = hash ? 'simplex:/' + hash : '';
  var open = document.getElementById('open');
  var msg = document.getElementById('msg');

  if (!target) {
    msg.textContent = 'В ссылке нет приглашения. Запроси новую ссылку у отправителя.';
    open.style.display = 'none';
  } else {
    open.href = target;
    document.getElementById('raw').textContent = 'simplex:/' + hash.slice(0, 28) + '…';
    // Android/iOS may require a gesture; try anyway, the button stays as fallback.
    setTimeout(function () {
      try { location.replace(target); } catch (e) {}
    }, 250);
  }
</script>
</body>
</html>
